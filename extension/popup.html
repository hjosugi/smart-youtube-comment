<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart YouTube Comment Overlay</title>
<style>
  :root { color-scheme: light dark; }
  body {
    min-width: 240px;
    margin: 0;
    padding: 12px;
    background: #17171d;
    color: #f2f2f4;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
  }
  .title {
    font-weight: 750;
    margin-bottom: 4px;
  }
  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #dd0531;
  }
  input[type="range"] {
    flex: 1;
    accent-color: #dd0531;
  }
  output {
    min-width: 38px;
    text-align: right;
    color: #aeb4c2;
    font-variant-numeric: tabular-nums;
  }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid #383844;
    border-radius: 7px;
    background: #252532;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #30303e; }
  #status {
    min-height: 16px;
    color: #7CFC8C;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="title" data-i18n="opt_title">Smart YouTube Comment Overlay</div>
  <label class="row">
    <span data-i18n="s_enabled">Overlay enabled</span>
    <input id="enabled" type="checkbox" />
  </label>
  <label class="row">
    <span data-i18n="s_opacity">Opacity</span>
    <input id="opacity" type="range" min="20" max="100" step="5" />
    <output id="opacity-value"></output>
  </label>
  <button id="options" type="button" data-i18n="opt_open_settings">Settings</button>
  <div id="status"></div>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
