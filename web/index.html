<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; img-src 'self' data: https://yt3.ggpht.com https://*.googleusercontent.com; connect-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://youtubei.googleapis.com https://syc-livechat-relay.acofun.workers.dev; style-src 'self' 'unsafe-inline'; media-src https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Smart YouTube Comment — 弾幕</title>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" href="icons/icon128.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon128.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="bar">
      <form id="launch" class="launch">
        <input
          id="video"
          type="text"
          inputmode="url"
          placeholder="YouTube URL / 動画ID（ライブ・録画どちらも）"
          autocomplete="off"
          aria-label="YouTube URL or video ID"
        />
        <button type="submit">再生</button>
      </form>
      <div class="bar-icons">
        <button id="toggle" class="icon-btn" type="button" aria-label="弾幕表示を切り替え" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 9h10"/><path d="M7 13h6"/></svg>
        </button>
        <button id="listToggle" class="icon-btn" type="button" aria-label="コメント一覧を切り替え" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
        </button>
        <button id="settings" class="icon-btn" type="button" aria-label="設定を開く">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="help" class="icon-btn" type="button" aria-label="ヘルプを開く">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <!-- mountPlayer replaces #player with the YT IFrame; the danmaku canvas is
           appended here as a sibling, absolutely positioned over the player. -->
      <div id="player"></div>
      <span id="status" class="status" role="status">idle</span>
    </main>

    <!-- non-danmaku comment feed (fills the space below the player) -->
    <section id="list" class="list-wrap"></section>

    <!-- core (classic IIFE globals) must load before the module orchestrator.
         store.js installs the localStorage shim that settings.js/filter.js use. -->
    <script src="store.js"></script>
    <script src="settings.js"></script>
    <script src="filter.js"></script>
    <script src="scoring.js"></script>
    <script src="emoji.js"></script>
    <script src="danmaku.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
