<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Smart YouTube Comment — 弾幕</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon128.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="bar">
      <form id="launch" class="launch">
        <input
          id="video"
          type="text"
          inputmode="url"
          placeholder="YouTube URL または 動画ID"
          autocomplete="off"
          aria-label="YouTube URL or video ID"
        />
        <button type="submit">再生</button>
      </form>
      <span id="status" class="status" role="status">idle</span>
    </header>

    <main class="stage" id="stage">
      <!-- mountPlayer replaces #player with the YT IFrame; the danmaku canvas is
           appended here as a sibling, absolutely positioned over the player. -->
      <div id="player"></div>
    </main>

    <!-- core (classic IIFE globals) must load before the module orchestrator.
         store.js installs the localStorage shim that settings.js/filter.js use. -->
    <script src="store.js"></script>
    <script src="settings.js"></script>
    <script src="filter.js"></script>
    <script src="scoring.js"></script>
    <script src="danmaku.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
